[package]
name = "trinity-model-viewer"
version = "0.1.0"
edition = "2024"
description = "Viewer for Trinity engine models, textures, skeletons and animations, read from your own game dump"
license = "MIT"
default-run = "trinity-model-viewer"

[dependencies]
anyhow = "1"
lewton = "0.10"
oozextract = "0.5.7"
opus = "0.3"
rfd = "0.18.0"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde_json = "1"
texture2ddecoder = "0.1.2"
three-d = { version = "0.19.0", features = ["egui-gui"] }

[[bin]]
name = "trinity-model-viewer"
path = "src/main.rs"

# Development tool: dumps file layouts and runs format checks over a dump (see the top of src/bin/probe.rs).
[[bin]]
name = "probe"
path = "src/bin/probe.rs"
