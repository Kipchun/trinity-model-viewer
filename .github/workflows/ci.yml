name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libx11-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libx11-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev
      # No doc-test step: doc tests only run for library targets and this package has binaries only.
      - name: Run tests without game assets
        run: cargo test --locked --all-targets --all-features

  build:
    name: Build (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libx11-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Build both binaries
        shell: bash
        run: |
          if [[ '${{ matrix.profile }}' == 'release' ]]; then
            cargo build --locked --bins --release
          else
            cargo build --locked --bins
          fi
      - name: Upload release binaries
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: trinity-model-viewer-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/trinity-model-viewer
            target/release/probe
            target/release/trinity-model-viewer.exe
            target/release/probe.exe
          if-no-files-found: error
          retention-days: 7
